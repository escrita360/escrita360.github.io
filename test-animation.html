<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Animação do Notebook - Escrita360</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: 'Quicksand', sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .test-container {
            text-align: center;
        }
        
        h1 {
            margin-bottom: 30px;
            color: #1D4ED8;
        }
        
        .notebook {
            width: 600px;
            height: 450px;
            position: relative;
            margin: 0 auto;
            transform: perspective(800px) rotateY(-12deg) rotateX(5deg);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .notebook:hover {
            transform: perspective(800px) rotateY(-3deg) rotateX(2deg) translateY(-8px);
            filter: drop-shadow(0 20px 40px rgba(99, 102, 241, 0.3));
        }

        .notebook-cover {
            background: linear-gradient(135deg, #1D4ED8, #1A42C2);
            width: 100%;
            height: 100%;
            border-radius: 12px;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 8px 25px rgba(99, 102, 241, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(99, 102, 241, 0.8);
            background-image: 
                linear-gradient(135deg, transparent 35%, rgba(255, 255, 255, 0.1) 50%, transparent 65%);
            transition: all 0.3s ease;
        }

        .notebook:hover .notebook-cover {
            box-shadow: 
                0 12px 35px rgba(99, 102, 241, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 0 rgba(0, 0, 0, 0.3);
        }

        .notebook-title {
            color: #FFFFFF;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .notebook-subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            font-size: 12px;
            opacity: 0.8;
        }

        .notebook-pages {
            background: linear-gradient(to bottom, #FFFEF7 0%, #FEFDF5 100%);
            width: 95%;
            height: 90%;
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 6px;
            box-shadow: 
                inset 0 0 0 1px #E5E5DC,
                inset 22px 0 0 rgba(99, 102, 241, 0.08),
                inset 24px 0 0 rgba(99, 102, 241, 0.15),
                0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .notebook:hover .notebook-pages {
            box-shadow: 
                inset 0 0 0 1px #E5E5DC,
                inset 22px 0 0 rgba(99, 102, 241, 0.12),
                inset 24px 0 0 rgba(99, 102, 241, 0.2),
                0 4px 12px rgba(0, 0, 0, 0.15);
        }

        .page {
            padding: 20px 30px 20px 38px;
            height: 100%;
            position: relative;
        }

        .page::before {
            content: '';
            position: absolute;
            left: 28px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #1D4ED8;
            opacity: 0.7;
        }

        .page-lines {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: 'Quicksand', sans-serif;
            font-size: 12px;
            line-height: 1.2;
        }

        .line {
            height: 16px;
            position: relative;
            border-bottom: 1px solid #E0E0E0;
            padding-top: 2px;
            color: #000000;
        }

        .line.filled {
            color: #2C3E50;
            font-weight: 500;
        }

        .line.completed {
            opacity: 0.8;
        }

        .line.writing {
            display: flex;
            align-items: flex-start;
            color: #1D4ED8;
            font-weight: 600;
        }

        /* Animações sequenciais das linhas do notebook */
        .line-1, .line-2, .line-3 {
            opacity: 0;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .line-1 {
            animation: fadeInLine 0.6s ease-out 0.8s forwards;
        }

        .line-1::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #FFFEF7;
            animation: typewriterEffect 2.2s steps(30, end) 1.4s forwards;
        }

        .line-2 {
            animation: fadeInLine 0.6s ease-out 1.8s forwards;
        }

        .line-2::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #FFFEF7;
            animation: typewriterEffect 2.0s steps(28, end) 2.4s forwards;
        }

        .line-3 {
            animation: fadeInLine 0.6s ease-out 2.8s forwards;
        }

        .line-3::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #FFFEF7;
            animation: typewriterEffect 2.4s steps(35, end) 3.4s forwards;
        }

        .line-4 {
            opacity: 0;
            animation: fadeInLine 0.6s ease-out 4.2s forwards;
        }

        @keyframes fadeInLine {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 0.8;
                transform: translateX(0);
            }
        }

        @keyframes typewriterEffect {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(100%);
            }
        }

        .animated-text {
            display: inline-block;
            min-height: 16px;
            position: relative;
            min-width: 2px;
            font-family: inherit;
            color: #1D4ED8;
            font-weight: 500;
        }

        .cursor {
            color: #1D4ED8;
            font-weight: 100;
            animation: blink 1.2s infinite;
            margin-left: 2px;
            position: relative;
            display: inline-block;
            font-size: 14px;
        }

        @keyframes blink {
            0%, 45% { opacity: 1; }
            46%, 100% { opacity: 0; }
        }

        .controls {
            margin-top: 30px;
        }

        .btn {
            background: #1D4ED8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 10px;
            font-family: inherit;
            font-weight: 500;
        }

        .btn:hover {
            background: #1A42C2;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Teste de Animação do Notebook</h1>
        
        <div class="notebook">
            <div class="notebook-cover">
                <div class="notebook-title">Minha Redação</div>
                <div class="notebook-subtitle">ENEM 2025</div>
            </div>
            <div class="notebook-pages">
                <div class="page">
                    <div class="page-lines">
                        <div class="line filled completed line-1">O tema da redação é muito importante...</div>
                        <div class="line filled completed line-2">Devemos sempre argumentar bem...</div>
                        <div class="line filled completed line-3">A estrutura deve ser clara e objetiva...</div>
                        <div class="line writing line-4">
                            <span class="animated-text"></span>
                            <span class="cursor">|</span>
                        </div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="resetAnimation()">Reiniciar Animação</button>
            <button class="btn" onclick="toggleTyping()">Pausar/Retomar Digitação</button>
        </div>

        <div class="status">
            <h3>Status da Animação:</h3>
            <p id="status-text">Carregando...</p>
        </div>
    </div>

    <script>
        let typingAnimation;
        let isPaused = false;
        
        function initTypingAnimation() {
            const animatedText = document.querySelector('.animated-text');
            const statusText = document.getElementById('status-text');
            
            if (!animatedText) {
                statusText.textContent = 'Erro: Elemento .animated-text não encontrado';
                return;
            }

            statusText.textContent = 'Animação iniciada com sucesso!';

            const texts = [
                'A democracia no Brasil enfrenta desafios...',
                'É fundamental analisarmos os impactos sociais...',
                'Portanto, a proposta de intervenção deve...',
                'Em suma, é necessário que o Estado promova...',
                'Assim, podemos concluir que a educação...'
            ];

            let textIndex = 0;
            let charIndex = 0;
            let isDeleting = false;
            let isPausedLocal = false;

            const typeEffect = () => {
                if (!animatedText || isPaused) return;

                const currentText = texts[textIndex];
                
                if (isPausedLocal) {
                    isPausedLocal = false;
                    setTimeout(typeEffect, 300);
                    return;
                }
                
                if (isDeleting) {
                    animatedText.textContent = currentText.substring(0, charIndex - 1);
                    charIndex--;
                } else {
                    animatedText.textContent = currentText.substring(0, charIndex + 1);
                    charIndex++;
                }

                let speed = isDeleting ? 30 : 80;
                speed += Math.random() * 40;

                if (!isDeleting && charIndex === currentText.length) {
                    speed = 2000;
                    isDeleting = true;
                    statusText.textContent = `Texto completo: "${currentText}" - Pausando para leitura...`;
                } else if (isDeleting && charIndex === 0) {
                    isDeleting = false;
                    textIndex = (textIndex + 1) % texts.length;
                    speed = 500;
                    isPausedLocal = true;
                    statusText.textContent = `Mudando para próximo texto (${textIndex + 1}/${texts.length})...`;
                }

                typingAnimation = setTimeout(typeEffect, speed);
            };

            // Iniciar após as linhas aparecerem
            setTimeout(() => {
                statusText.textContent = 'Iniciando digitação...';
                typeEffect();
            }, 4800);
        }

        function resetAnimation() {
            // Limpar animação atual
            if (typingAnimation) {
                clearTimeout(typingAnimation);
            }
            
            // Reset do texto
            const animatedText = document.querySelector('.animated-text');
            if (animatedText) {
                animatedText.textContent = '';
            }
            
            // Reset das linhas
            const lines = document.querySelectorAll('.line-1, .line-2, .line-3, .line-4');
            lines.forEach(line => {
                line.style.animation = 'none';
                line.offsetHeight; // Trigger reflow
                line.style.animation = null;
            });
            
            isPaused = false;
            document.getElementById('status-text').textContent = 'Animação reiniciada!';
            
            // Reiniciar animação
            setTimeout(initTypingAnimation, 100);
        }

        function toggleTyping() {
            isPaused = !isPaused;
            const statusText = document.getElementById('status-text');
            statusText.textContent = isPaused ? 'Digitação pausada' : 'Digitação retomada';
            
            if (!isPaused && typingAnimation) {
                initTypingAnimation();
            }
        }

        // Iniciar quando a página carregar
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('status-text').textContent = 'Página carregada, aguardando animações das linhas...';
            initTypingAnimation();
        });

        // Monitorar performance
        window.addEventListener('load', () => {
            setTimeout(() => {
                const animatedText = document.querySelector('.animated-text');
                const statusText = document.getElementById('status-text');
                
                if (animatedText && animatedText.textContent.length > 0) {
                    statusText.innerHTML += '<br>✅ Animação funcionando perfeitamente!';
                } else {
                    statusText.innerHTML += '<br>⚠️ Possível problema na animação';
                }
            }, 6000);
        });
    </script>
</body>
</html>
